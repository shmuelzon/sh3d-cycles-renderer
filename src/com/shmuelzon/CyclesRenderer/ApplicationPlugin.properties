name=Cycles Renderer
class=com.shmuelzon.CyclesRenderer.Plugin
description=Adds Blender's Cycles path tracer to the renderers of the photo and video dialogs
version=${VERSION}
license=MIT
provider=(C) Copyrights 2026 Assaf Inbal
applicationMinimumVersion=7.0
javaMinimumVersion=1.8

CyclesRenderer.SettingsAction.NAME=Cycles Renderer Settings...
CyclesRenderer.SettingsAction.SHORT_DESCRIPTION=Settings of the Cycles renderer for this project
CyclesRenderer.SettingsAction.MENU=Tools

CyclesRenderer.SettingsPanel.title=Cycles Renderer Settings
CyclesRenderer.SettingsPanel.okButton=OK
CyclesRenderer.SettingsPanel.cancelButton=Cancel
CyclesRenderer.SettingsPanel.resetButton=Reset to defaults
CyclesRenderer.SettingsPanel.previewButton=Preview
CyclesRenderer.SettingsPanel.previewButton.tooltip=Renders the current point of view at the fast quality with these settings, before they're saved
CyclesRenderer.SettingsPanel.stopButton=Stop

CyclesRenderer.SettingsPanel.deviceSection=Device
CyclesRenderer.SettingsPanel.gpuCheckBox=Render with the GPU
CyclesRenderer.SettingsPanel.gpuCheckBox.tooltip=<html>Renders with the first GPU Cycles finds (Metal on macOS, HIP for AMD GPUs), or the CPU if there's none.<br>No GPU kernels are bundled: Metal compiles them on first use, HIP only if AMD's HIP SDK is installed,<br>which takes a few minutes. If the GPU fails, the CPU renders the image</html>
CyclesRenderer.SettingsPanel.devicesLabel.detecting=Detecting GPUs...
CyclesRenderer.SettingsPanel.devicesLabel.none=No GPU found
CyclesRenderer.SettingsPanel.devicesLabel.found=Found: %s
CyclesRenderer.SettingsPanel.devicesLabel.error=Can't list devices: %s

CyclesRenderer.SettingsPanel.qualitySection=Quality
CyclesRenderer.SettingsPanel.highQualitySamplesLabel=Samples (best quality):
CyclesRenderer.SettingsPanel.highQualitySamplesLabel.tooltip=Maximum samples per pixel at the best quality (the right-most position of the photo dialog's quality slider). Adaptive sampling stops earlier where the image is clean
CyclesRenderer.SettingsPanel.lowQualitySamplesLabel=Samples (fast):
CyclesRenderer.SettingsPanel.lowQualitySamplesLabel.tooltip=Maximum samples per pixel at the fast quality (the third position of the quality slider), also used by the preview

CyclesRenderer.SettingsPanel.lightSection=Light
CyclesRenderer.SettingsPanel.autoExposureCheckBox=Automatic exposure
CyclesRenderer.SettingsPanel.autoExposureCheckBox.tooltip=<html>Adjusts the exposure of each image to its content, as a camera does.<br>The renders of a project aren't comparable anymore, e.g. the images of each light of the floor plan plugin or the frames of a video</html>
CyclesRenderer.SettingsPanel.exposureLabel=Exposure (EV):
CyclesRenderer.SettingsPanel.exposureLabel.tooltip=Exposure of the images, in stops: 0 is as bright as Sweet Home 3D's other renderers, +1 twice as bright
CyclesRenderer.SettingsPanel.exposureLabel.autoTooltip=Correction of the automatic exposure, in stops
CyclesRenderer.SettingsPanel.skyStrengthLabel=Sky strength:
CyclesRenderer.SettingsPanel.skyStrengthLabel.tooltip=Brightness of the daylight sky, relative to YafaRay's (the sun is unchanged)

CyclesRenderer.SettingsPanel.colorSection=Colors
CyclesRenderer.SettingsPanel.viewLabel=View:
CyclesRenderer.SettingsPanel.viewLabel.tooltip=<html>How the light of the scene becomes colors:<br>Standard: as Sweet Home 3D's other renderers, colors are clipped when they're too bright<br>AgX: as Blender, very bright colors are softly compressed toward white</html>
CyclesRenderer.SettingsPanel.viewComboBox.Standard=Standard (as SunFlow and YafaRay)
CyclesRenderer.SettingsPanel.viewComboBox.AgX=AgX (as Blender)
CyclesRenderer.SettingsPanel.lookLabel=Look:
CyclesRenderer.SettingsPanel.lookLabel.tooltip=Contrast of the view, as Blender's looks
CyclesRenderer.SettingsPanel.highlightCompressionLabel=Highlight compression:
CyclesRenderer.SettingsPanel.highlightCompressionLabel.tooltip=<html>Darkens bright areas, e.g. the outdoors seen through windows, keeping their details (0 for none).<br>It depends on the content of each image: not for the floor plan plugin's light images</html>

CyclesRenderer.SettingsPanel.previewSection=Preview
CyclesRenderer.SettingsPanel.previewStatus.rendering=Rendering...
CyclesRenderer.SettingsPanel.previewStatus.done=Rendered in %.1f s with %s
CyclesRenderer.SettingsPanel.previewStatus.stopped=Stopped
CyclesRenderer.SettingsPanel.previewStatus.error=Rendering failed: %s
